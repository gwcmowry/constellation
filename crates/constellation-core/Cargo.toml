[package]
name = "constellation-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1"
memmap2 = "0.9"
needletail = "0.7"
pulp = { version = "0.22", optional = true }
rayon = "1"
rustc-hash = "2"
smallvec = "1"

[features]
default = []
simd = ["pulp"]

[dev-dependencies]
criterion = "0.8"
proptest = "1"
tempfile = "3"
