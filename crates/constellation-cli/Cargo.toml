[package]
name = "constellation-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
simd = ["constellation-core/simd"]

[[bin]]
name = "constellation"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
constellation-core = { path = "../constellation-core" }
rayon = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
