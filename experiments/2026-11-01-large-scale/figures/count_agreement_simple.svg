  <g id="text_17">
   <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17283b" x="46.8" y="54" transform="rotate(-0 46.8 54)">How closely do the counts match?</text>
