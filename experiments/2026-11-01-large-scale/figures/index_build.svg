   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526175" x="40.32" y="43.242281" transform="rotate(-0 40.32 43.242281)">Prior measurements on the same Ryzen 9 7900X · 12 physical cores · prepared splici FASTA · k31</text>
  </g>
  <g id="text_35">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526175" x="40.32" y="319.464" transform="rotate(-0 40.32 319.464)">One saved fresh build per tool. No benchmarks rerun. Build cost is independent of read volume for a fixed reference/configuration.</text>
  </g>
  <g id="text_36">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526175" x="40.32" y="338.9256" transform="rotate(-0 40.32 338.9256)">Index content differs: sparse gene/state keys (Constellation) versus denser target/path graphs (competitors).</text>
  </g>
  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526175" x="40.32" y="358.02" transform="rotate(-0 40.32 358.02)">All builders start from the same prepared FASTA. Genome/GTF reference preparation is excluded.</text>
  </g>
