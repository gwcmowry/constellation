name: Release binaries

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+crt-static'
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install static build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component rust-docs --target x86_64-unknown-linux-musl
      - name: Formatting
        run: cargo +1.93.1 fmt --all --check
      - name: Test the musl target
        run: cargo +1.93.1 test --locked --target x86_64-unknown-linux-musl --workspace
      - name: Build and verify archive
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 scripts/package_release.py "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: dist
      - name: Publish tested archives for the existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Constellation $RELEASE_TAG" \
            --notes-file release-notes.md \
            ./*.tar.gz ./*.sha256
