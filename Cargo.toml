[workspace]
members = [
    "crates/constellation-core",
    "crates/constellation-cli",
]
resolver = "2"

[profile.release]
debug = true
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true

# Portable distributable executables; keep profiler symbols in normal release builds.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
